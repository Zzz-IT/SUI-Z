name: Unit Tests

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Configure Gradle properties
        run: |
          set -euo pipefail
          {
            echo 'android.sdk.channel=3'
            echo 'org.gradle.caching=true'
            echo 'org.gradle.parallel=true'
          } >> gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew :ui:testDebugUnitTest :module:testDebugUnitTest --stacktrace

      # Gradle exits 0 on "No tests found for given includes". Without this
      # step the job stayed green for a long time while both test tasks had no
      # test sources at all. scripts/verify_tests_ran.sh reads the JUnit XML
      # and fails when zero tests actually executed.
      - name: Verify unit tests actually ran
        run: |
          set -euo pipefail
          bash scripts/verify_tests_ran.sh module testDebugUnitTest
          bash scripts/verify_tests_ran.sh ui testDebugUnitTest

      # Watchdog behaviour is pure shell logic that only shows up on a device,
      # so it is exercised here against a fake filesystem instead. Runs under
      # bash; scripts/test_watchdog.sh itself asserts that service.sh stays
      # POSIX-clean for /system/bin/sh.
      - name: Watchdog behavioural tests
        run: |
          set -euo pipefail
          bash scripts/test_watchdog.sh
